[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kol-trading-digital-twin"
version = "0.1.0"
description = "Point-in-time-safe behavior cloning research skeleton"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2.0",
  "duckdb>=1.0.0",
  "pyarrow>=17.0.0",
  "requests>=2.32.0",
  "PyYAML>=6.0.2",
  "numpy>=1.23.3",
  "typing-extensions>=4.6.0",
  "scikit-learn>=1.4.0",
  "lightgbm>=4.5.0",
  "xgboost>=2.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
junit_family = "xunit2"
